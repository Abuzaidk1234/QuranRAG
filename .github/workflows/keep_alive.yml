name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute sleep
    - cron: "*/13 * * * *"
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s https://quranrag.onrender.com/health > /dev/null
